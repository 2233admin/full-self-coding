[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/2233admin/full-self-coding"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
tempfile = "3"
fsc-core = { path = "crates/fsc-core" }
fsc-scope = { path = "crates/fsc-scope" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
